<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>文字提取与 OCR 对比</title>
<style>
:root{--ink:#182925;--muted:#60716c;--line:#dce5e1;--surface:#f4f7f6;--green:#137658;--red:#b33e4d;--blue:#245ab7}
*{box-sizing:border-box}body{margin:0;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);letter-spacing:0}
header,footer{padding:24px 32px;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:12px 0 8px}p{margin:8px 0}.muted,small{color:var(--muted)}a{color:var(--blue);overflow-wrap:anywhere}
button,select{font:inherit;border:1px solid var(--line);border-radius:5px;min-height:44px;background:white;color:var(--ink);padding:8px 12px;max-width:100%}button{cursor:pointer}button:hover{background:var(--surface)}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:22px 32px;background:var(--surface)}.summary strong{font-size:24px;display:block;font-variant-numeric:tabular-nums}.summary span{font-size:12px;color:var(--muted)}.limits{padding:16px 32px;border-bottom:1px solid var(--line)}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1680px;margin:auto}aside{padding:24px 16px;border-right:1px solid var(--line)}aside label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}aside select{width:100%;margin-bottom:12px}nav{display:grid;gap:3px}nav button{text-align:left;border-color:transparent;font-size:13px;overflow-wrap:anywhere}nav button[aria-current=true]{background:#eaf4ef;color:var(--green);border-color:#c5dfd0}main{min-width:0;padding:24px 32px}.object-heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.badge{display:inline-block;font-size:12px;color:var(--green);background:#eaf4ef;padding:2px 7px;border-radius:4px}.badge.bad{color:var(--red);background:#fbeef0}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.arm{min-width:0;border-top:2px solid var(--line);padding-top:14px}.arm.candidate{border-color:var(--green)}.metrics{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;margin-bottom:14px}.metrics b{font-size:16px}.extraction{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);padding:16px;max-height:450px;overflow:auto;font:13px/1.8 ui-monospace,"Microsoft YaHei",monospace;border-radius:5px}.original{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}.original img{display:block;max-width:100%;max-height:420px;object-fit:contain;object-position:left;margin-top:12px}.check{padding:12px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.check p{font-size:13px}details{margin:12px 0}summary{min-height:44px;cursor:pointer;align-content:center}.file-links{display:flex;flex-wrap:wrap;gap:16px;padding:12px 0}.mobile-picker{display:none}.warning{color:var(--red)}footer{font-size:12px;color:var(--muted)}.excerpt{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:800px){header,.summary,.limits,main,footer{padding:18px}.layout{display:block}aside{border:0;padding:18px 18px 0}nav{display:none}.mobile-picker{display:block;width:100%}.summary{grid-template-columns:repeat(2,1fr)}.compare{grid-template-columns:1fr;gap:24px}h1{font-size:21px}}
</style>
<header><h1>文字提取与 OCR 对比</h1><div class="muted">MarkItDown + 按需 OCR / 当前解析流程 · 独立实验 #59</div><div class="file-links"><a href="results.json">完整结果 JSON</a><a href="metrics.csv">指标 CSV</a><a href="policy.json">固定分流规则</a></div></header>
<section class="summary" id="summary"></section><section class="limits" id="limits"></section>
<div class="layout"><aside><label for="filter">文档类型</label><select id="filter"><option value="all">全部样本</option><option value="word">Word</option><option value="pdf">PDF</option></select><select id="mobile" class="mobile-picker" aria-label="选择对比样本"></select><nav aria-label="对比样本" id="samples"></nav></aside><main id="detail"></main></div>
<footer>仅比较文字提取与 OCR，不调用 Embedding 或问答模型。正式上传流程、知识库、引用和用户账单未更改；真实文档及完整报告不提交 Git。</footer>
<script type="application/json" id="data">__EXPERIMENT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),rows=data.results;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id),sum=(arm,key)=>rows.reduce((n,r)=>n+(r.arms[arm].metrics[key]||0),0);
const pages=arm=>rows.reduce((n,r)=>n+r.arms[arm].ocr_pages,0);
let selected=rows[0]?.sample.id;
el('summary').innerHTML=`<div><strong>${rows.length}</strong><span>对比样本 · 独立校准 ${data.calibration.trials[0].checks.length} 页</span></div><div><strong>${sum('baseline','facts_found')} → ${sum('candidate','facts_found')}</strong><span>提取关键事实 / ${sum('candidate','fact_count')} · 非全文准确率</span></div><div><strong>${pages('baseline')} → ${pages('candidate')}</strong><span>各方案所需 OCR 页数，包含 Word 图片</span></div><div><strong>≤ ¥${data.budget.reserved_upper_yuan.toFixed(4)}</strong><span>累计保守预留 / ¥20 预算</span></div>`;
el('limits').innerHTML=`<strong>结果边界</strong><p>${data.live_ocr?'OCR 为真实接口结果；费用按保守费率预留，不代表实际账单。':'未启用外部调用，待识别项标为不完整。'} 事实检查只覆盖标注片段，不能当作全文准确率，也不评估检索与回答质量。</p><p>耗时分别展示本次本地处理和首次记录的 OCR 等待，复用不代表首次处理速度。复杂表格、双栏阅读顺序和不可靠隐藏文字层仍需补测；少量固定事实通过不能证明这些场景已经解决。</p>`;
const anomalous=rows.filter(r=>r.arms.candidate.metrics.compatibility_radicals>0);
if(anomalous.length)el('limits').insertAdjacentHTML('beforeend',`<p class="warning">已发现 ${anomalous.length} 份候选结果含外观近似汉字的特殊字形字符，须先修正；不能以少量事实通过就直接替换正式解析。</p>`);
function locationText(l){return l.page_number?`第 ${l.page_number} 页`:[l.section,l.block_type==='table'?'表格':l.block_type==='image'?'图片':'段落',`位置 ${l.document_block??'—'}`].filter(Boolean).join(' · ')}
function show(id){selected=id;const row=rows.find(r=>r.sample.id===id);if(!row)return;const s=row.sample;
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));el('mobile').value=id;
el('detail').innerHTML=`<div class="object-heading"><div><h2>${esc(s.original_filename||s.id)}</h2><span class="badge">${s.origin==='generated'?'固定生成样本':'真实文件只读副本'}</span></div><a href="samples/${encodeURIComponent(s.path)}">打开原文件</a></div><section class="original"><h3>原文核对</h3><p class="excerpt">${esc(s.original_excerpt||'尚未独立标注，不参与事实评分。')}</p>${s.preview?`<details><summary>查看 PDF 原始第一页</summary><img src="${esc(s.preview)}" alt="原始 PDF 第一页"></details>`:''}${s.review_note?`<p>${esc(s.review_note)}</p>`:''}</section><div class="compare">${['baseline','candidate'].map(arm=>{const a=row.arms[arm],m=a.metrics;return `<section class="arm ${arm}"><h2>${arm==='baseline'?'当前方案':'候选方案'} <span class="badge ${a.complete?'':'bad'}">${a.complete?'解析完成':'结果不完整'}</span></h2><div class="metrics"><span>关键事实 <b>${m.facts_found}/${m.fact_count}</b></span><span>来源定位 <b>${m.source_correct}/${m.source_hits.length}</b></span><span>标注顺序 <b>${m.ordered?'通过':'未通过或未标注'}</b></span><span>OCR <b>${a.ocr_pages} 页</b></span><span>OCR 费率上限 <b>${a.ocr_upper_yuan===null?'未核实':'¥'+a.ocr_upper_yuan.toFixed(2)}</b></span><span>本地处理 <b>${a.first_local_seconds}s</b></span><span>已记录 OCR 等待 <b>${a.recorded_ocr_seconds}s</b></span></div>${a.warnings.length?`<p class="warning">${esc(a.warnings.join('；'))}</p>`:''}<h3>提取内容</h3><pre class="extraction">${esc(a.parsed.text||'暂无可用结果')}</pre><h3>关键事实核对</h3>${m.checks.length?m.checks.map(q=>`<div class="check"><strong>${esc(q.fact)}</strong><p>${q.found?'已提取':'未提取'} · ${q.source_correct?'位置正确':'位置缺失或不符'}</p><small>预期：${esc(locationText(q.expected_location))}<br>实际：${esc(q.actual_locations.map(locationText).join(' / ')||'无结构化位置')}</small></div>`).join(''):'<p class="muted">无独立事实标注，仅作定性比较。</p>'}<details><summary>处理路径与来源位置</summary><pre class="extraction">${esc(JSON.stringify({decisions:a.decisions,pages:a.parsed.pages,locations:a.parsed.source_locations},null,2))}</pre></details></section>`}).join('')}</div>`;
}
function populate(){const filtered=rows.filter(r=>el('filter').value==='all'||r.sample.kind.startsWith(el('filter').value));el('samples').innerHTML=filtered.map(r=>`<button type="button" data-id="${esc(r.sample.id)}">${esc(r.sample.id)}</button>`).join('');el('mobile').innerHTML=filtered.map(r=>`<option value="${esc(r.sample.id)}">${esc(r.sample.original_filename||r.sample.id)}</option>`).join('');el('samples').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));show(filtered.some(r=>r.sample.id===selected)?selected:filtered[0]?.sample.id)}
el('filter').onchange=populate;el('mobile').onchange=e=>show(e.target.value);populate();
</script>
</html>
