name: cloud-114-acceptance
services:
  redis:
    image: redis:7.2-alpine
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cloud114
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: rag_auth_test_cloud114
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cloud114 -d rag_auth_test_cloud114"]
      interval: 2s
      retries: 20
  api:
    image: local/zhiku-cloud114-api:test
    build:
      context: ../../..
      dockerfile: backend/tests/browser/cloud-ending.Dockerfile
    command: [uvicorn, cloud_ending_fixture:app, --host, 0.0.0.0, --port, '8000']
    environment:
      DATABASE_URL: sqlite:////tmp/cloud-107-acceptance.db
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3129
      API_PUBLIC_URL: http://localhost:8129
      PREVIEW_ENABLED: 'true'
      PREVIEW_DOMAIN: preview.cloud107.test
      PYTHONPATH: /app:/app/tests:/app/tests/browser
      AUTH_COOKIE_SECURE: 'false'
      RESOURCE_CACHE_DIR: /tmp/cloud-114-cache
      AUTH_TEST_DATABASE_URL: postgresql+psycopg://cloud114:local-test-only@db:5432/rag_auth_test_cloud114
      MIGRATION_DATABASE_URL: postgresql+psycopg://cloud114:local-test-only@db:5432/rag_auth_test_cloud114
    ports: ['127.0.0.1:8129:8000']
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  web:
    image: local/zhiku-cloud114-web:test
    build:
      context: ../../..
      dockerfile: frontend/tests/browser/cloud-ending.Dockerfile
    ports: ['127.0.0.1:3129:3000']
