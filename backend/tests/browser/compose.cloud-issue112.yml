name: cloud-issue112-acceptance
services:
  redis:
    image: redis:7.2-alpine
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cloud112browser
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: rag_auth_test_cloud112_browser
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cloud112browser -d rag_auth_test_cloud112_browser"]
      interval: 2s
      retries: 20
  api:
    image: local/rag-cloud-issue112-api:test
    build:
      context: ../../..
      dockerfile: backend/tests/browser/cloud-issue112.Dockerfile
    command: [uvicorn, cloud_issue112_fixture:app, --host, 0.0.0.0, --port, '8000']
    environment:
      DATABASE_URL: sqlite:////tmp/cloud-107-acceptance.db
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3132
      API_PUBLIC_URL: http://localhost:8132
      PREVIEW_ENABLED: 'true'
      PREVIEW_DOMAIN: preview.cloud107.test
      PYTHONPATH: /app:/app/tests:/app/tests/browser
      AUTH_COOKIE_SECURE: 'false'
      RESOURCE_CACHE_DIR: /tmp/cloud-112-cache
      AUTH_TEST_DATABASE_URL: postgresql+psycopg://cloud112browser:local-test-only@db:5432/rag_auth_test_cloud112_browser
      MIGRATION_DATABASE_URL: postgresql+psycopg://cloud112browser:local-test-only@db:5432/rag_auth_test_cloud112_browser
    ports: ['127.0.0.1:8132:8000']
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  web:
    image: local/rag-issue112-web:test
    build:
      context: ../../..
      dockerfile: backend/tests/browser/cloud-issue112-web.Dockerfile
    ports: ['127.0.0.1:3132:3000']
