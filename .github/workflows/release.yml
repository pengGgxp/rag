name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/pengggxp/rag-

concurrency:
  group: production-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release tag and commit
        id: release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$sha"
          test "$(git rev-parse HEAD)" = "$sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          printf 'version=%s\nsha=%s\n' "$VERSION" "$sha" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      check_images: false

  publish:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
            cache_scope: release-api
          - service: web
            context: frontend
            dockerfile: frontend/Dockerfile
            cache_scope: release-web
            build_args: NEXT_PUBLIC_API_URL=https://syfc.moonlitstarway.top/api
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}${{ matrix.service }}:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}${{ matrix.service }}:sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
      - name: Push to GHCR and verify anonymous access by digest
        timeout-minutes: 15
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_PREFIX$SERVICE"
          start=$SECONDS
          docker push "$IMAGE:$VERSION" | tee push.log
          digest=$(awk '$2 == "digest:" { print $3 }' push.log)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker push "$IMAGE:sha-$SHA"
          printf 'GHCR push completed in %s seconds\n' "$((SECONDS - start))"
          config=$(mktemp -d)
          trap 'rmdir "$config"' EXIT
          for reference in "$IMAGE:$VERSION" "$IMAGE:sha-$SHA" "$IMAGE@$digest"; do
            actual=$(docker --config "$config" manifest inspect --verbose "$reference" | jq -er '.Descriptor.digest')
            test "$actual" = "$digest"
          done
          mkdir -p digests
          printf '%s\n' "$digest" > "digests/$SERVICE.digest"
          printf -- '- %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/*.digest
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Build the server release package
        run: |
          set -euo pipefail
          python deploy/release_package.py \
            --backend-root backend \
            --digests digests \
            --output . \
            --version "$VERSION" \
            --commit "$COMMIT_SHA" \
            --image-prefix "$IMAGE_PREFIX" \
            --alembic-head "$(python deploy/alembic_head.py backend)"
          sha256sum -c "zhiku-$VERSION.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ env.VERSION }}
          path: |
            zhiku-${{ env.VERSION }}.tar.gz
            zhiku-${{ env.VERSION }}.tar.gz.sha256
          overwrite: true
          if-no-files-found: error
          retention-days: 90
