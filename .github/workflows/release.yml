name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release tag and commit
        id: release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$sha"
          test "$(git rev-parse HEAD)" = "$sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          printf 'version=%s\nsha=%s\n' "$VERSION" "$sha" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      check_images: false

  publish:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile
          - service: worker
            context: backend
            dockerfile: backend/Dockerfile
          - service: web
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=https://syfc.moonlitstarway.top/api
    env:
      IMAGE: ${{ vars.SWR_REGISTRY }}/${{ vars.SWR_ORGANIZATION }}/zhiku-${{ matrix.service }}
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,scope=release-${{ matrix.service }},mode=max,ignore-error=true
      - name: Verify published images and record digest
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for tag in "$VERSION" "sha-$SHA"; do
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
            test "$actual" = "$DIGEST"
          done
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            | jq -e '.mediaType == "application/vnd.docker.distribution.manifest.v2+json"'
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$SERVICE.digest"
          printf -- '- %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.digest
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT_SHA: ${{ needs.verify.outputs.sha }}
      REGISTRY: ${{ vars.SWR_REGISTRY }}
      ORGANIZATION: ${{ vars.SWR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Build the server release package
        run: |
          set -euo pipefail
          python deploy/release_package.py \
            --backend-root backend \
            --digests digests \
            --output . \
            --version "$VERSION" \
            --commit "$COMMIT_SHA" \
            --registry "$REGISTRY" \
            --organization "$ORGANIZATION" \
            --alembic-head "$(python deploy/alembic_head.py backend)"
          sha256sum -c "zhiku-$VERSION.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ env.VERSION }}
          path: |
            zhiku-${{ env.VERSION }}.tar.gz
            zhiku-${{ env.VERSION }}.tar.gz.sha256
          overwrite: true
          if-no-files-found: error
          retention-days: 90
