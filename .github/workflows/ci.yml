name: ci

on:
  pull_request:
    branches-ignore:
      - test
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag
      SITE_CONFIG_ENCRYPTION_KEY: uyq8T_9zj1cVz0w5L1yUDf4qNzN7Zvo7zGvWr3a0X6E= # gitleaks:allow
      MCP_CREDENTIAL_KEY: bWNwLWNyZWRlbnRpYWwtdGVzdC1rZXktMzItYnl0ZXM= # gitleaks:allow
      AUTH_SECRET_KEY: test-only-auth-secret-key-at-least-32-characters # gitleaks:allow
      AUTH_COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8000
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify Alembic head matches release manifest helper
        run: |
          expected=$(python ../deploy/alembic_head.py .)
          actual=$(alembic heads | awk '{print $1}')
          test "$actual" = "$expected"
      - name: Test personal account migration from the legacy schema
        env:
          PGPASSWORD: rag
          PERSONAL_ACCOUNTS_TEST_DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag_auth_test_personal_accounts
        run: |
          createdb -h 127.0.0.1 -U rag rag_auth_test_personal_accounts
          MIGRATION_DATABASE_URL="$PERSONAL_ACCOUNTS_TEST_DATABASE_URL" alembic upgrade 0078_tool_detail
          pytest -q --tb=short tests/test_personal_accounts_postgres.py
      - name: Run backend tests
        run: pytest -q --tb=short

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: https://zk.str1ct.top/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify production API build input
        run: test "$NEXT_PUBLIC_API_URL" = "https://zk.str1ct.top/api"

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production compose
        run: |
          python -m pip install pyyaml
          python deploy/validate_config.py --app-template deploy/app.env.example --deployment-template deploy/deployment.env.example
          python deploy/alembic_head.py backend
          POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
            docker compose -f deploy/compose.production.yml --env-file deploy/deployment.env.example --env-file deploy/app.env.example config --quiet
      - name: Verify release package manifest
        run: |
          python -m py_compile deploy/deploy_release.py deploy/check_health.py deploy/maintenance.py deploy/release_package.py
          test -f deploy/nginx/zk.str1ct.top.conf
          test -f deploy/nginx/http-preview.conf
      - name: Test deployment scripts
        run: python -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: deploy
      - name: Actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: .github/workflows/*.yml

  images:
    needs:
      - secrets
      - backend
      - frontend
      - contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: worker
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=https://zk.str1ct.top/api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
