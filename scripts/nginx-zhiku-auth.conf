 # Authentication callbacks and reset links contain one-time secrets. Keep HTTP path logging disabled for this trial site.

server {
    listen 80;
    listen [::]:80;
    server_name zk.str1ct.top;
    access_log off;
    client_max_body_size 201m;
    client_body_timeout 600s;
    proxy_cache off;
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zk.str1ct.top;
    access_log off;
    client_max_body_size 201m;
    client_body_timeout 600s;
    proxy_cache off;
    ssl_certificate /etc/nginx/ssl/zk.str1ct.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zk.str1ct.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        proxy_cache off;
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
    }
    location / {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
