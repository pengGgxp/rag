services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: rustfs/rustfs:latest
    command: server /data --console-enable --console-address ":9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-documents
      S3_REGION: us-east-1
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MCP_CREDENTIAL_KEY: ${MCP_CREDENTIAL_KEY:-}
      MCP_ALLOWED_PRIVATE_HOSTS: ${MCP_ALLOWED_PRIVATE_HOSTS:-}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-60}
      PDF_PARSER: ${PDF_PARSER:-local}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      DOCMIND_TIMEOUT_SECONDS: ${DOCMIND_TIMEOUT_SECONDS:-300}
      DOCMIND_POLL_SECONDS: ${DOCMIND_POLL_SECONDS:-3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-168}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      SITE_CONFIG_ENCRYPTION_KEY: ${SITE_CONFIG_ENCRYPTION_KEY:-}
      OIDC_NAME: ${OIDC_NAME:-企业账号}
      OIDC_METADATA_URL: ${OIDC_METADATA_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ZHIFUX_ENABLED: ${ZHIFUX_ENABLED:-false}
      ZHIFUX_API_BASE_URL: ${ZHIFUX_API_BASE_URL:-}
      ZHIFUX_MERCHANT_NUM: ${ZHIFUX_MERCHANT_NUM:-}
      ZHIFUX_SECRET: ${ZHIFUX_SECRET:-}
      ZHIFUX_PAY_TYPE: ${ZHIFUX_PAY_TYPE:-}
      RECHARGE_PACKAGES_JSON: ${RECHARGE_PACKAGES_JSON:-[]}
      USAGE_AUTHORIZATION_HOLD_CREDITS: ${USAGE_AUTHORIZATION_HOLD_CREDITS:-1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rag-documents
      S3_REGION: us-east-1
      SITE_CONFIG_ENCRYPTION_KEY: ${SITE_CONFIG_ENCRYPTION_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      PDF_PARSER: ${PDF_PARSER:-local}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      DOCMIND_TIMEOUT_SECONDS: ${DOCMIND_TIMEOUT_SECONDS:-300}
      DOCMIND_POLL_SECONDS: ${DOCMIND_POLL_SECONDS:-3}
      USAGE_AUTHORIZATION_HOLD_CREDITS: ${USAGE_AUTHORIZATION_HOLD_CREDITS:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:

