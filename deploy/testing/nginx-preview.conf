# Certificates link to the independent Certbot lineage; validate with nginx -t.
# Keep tickets, cookies and query strings out of access logs.
server {
    listen 443 ssl;
    server_name *.test-zk-preview.moonlitstarway.top;
    ssl_certificate /opt/zhiku-test/config/test-preview.fullchain.pem;
    ssl_certificate_key /opt/zhiku-test/config/test-preview.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16m;
    client_body_timeout 30s;
    location / {
        proxy_pass http://127.0.0.1:18181;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 30s;
    }
}
