name: zhiku-private-test
x-app: &app
  image: ${API_IMAGE:?}
  env_file: ../../config/app.env
  environment:
    APP_VERSION: ${APP_VERSION:?}
    GIT_COMMIT: ${GIT_COMMIT:?}
  restart: unless-stopped
  volumes:
    - cache:/var/cache/rag-resources
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_test
      POSTGRES_DB: rag_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 64m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag_test -d rag_test"]
      interval: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.2-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - redis:/data
    restart: unless-stopped
  api:
    <<: *app
    ports: ["127.0.0.1:18180:8000"]
  worker:
    <<: *app
    command: [celery, -A, app.tasks.celery_app, worker, --loglevel=warning, --pool=solo, --concurrency=1, --hostname=tasks@%h]
  preview:
    <<: *app
    command: [uvicorn, app.preview_gateway:app, --host, 0.0.0.0, --port, "8001", --no-access-log, --no-proxy-headers]
    ports: ["127.0.0.1:18181:8001"]
  web:
    image: ${WEB_IMAGE:?}
    ports: ["127.0.0.1:18130:3000"]
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    profiles: [setup]
    restart: "no"
volumes:
  postgres:
    external: true
    name: zhiku-private-test_postgres
  redis:
    external: true
    name: zhiku-private-test_redis
  cache:
    external: true
    name: zhiku-private-test_cache
