server {
    listen 127.0.0.1:18443 ssl default_server;
    server_name test.str1ct.localhost;
    ssl_certificate /opt/zhiku-test/config/test.crt;
    ssl_certificate_key /opt/zhiku-test/config/test.key;
    client_max_body_size 100m;
    location /api/ {
        proxy_pass http://127.0.0.1:18180/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 127.0.0.1:18443 ssl;
    server_name "~^[0-9a-f]{32}\.preview\.str1ct\.localhost$";
    ssl_certificate /opt/zhiku-test/config/test.crt;
    ssl_certificate_key /opt/zhiku-test/config/test.key;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
