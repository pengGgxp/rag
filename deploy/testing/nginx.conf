server {
    listen 80 default_server;
    server_name test.zk.moonlitstarway.top;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/zhiku-test/acme-webroot;
        try_files $uri =404;
    }
    location / {
        return 308 https://test.zk.moonlitstarway.top$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name test.zk.moonlitstarway.top;
    ssl_certificate /etc/letsencrypt/live/zhiku-test-main/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhiku-test-main/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Allow Base64/JSON overhead for a 200 MiB Skill; API limits decoded bytes.
    client_max_body_size 268m;
    location ^~ /api/internal/ {
        return 404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18180/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
