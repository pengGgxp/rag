# Install only after the preview gateway is listening on loopback:8001 and DNS
# is ready. Never log access tickets or query strings.
server {
    listen 80;
    server_name *.preview-syfc.moonlitstarway.top;
    access_log off;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name *.preview-syfc.moonlitstarway.top;
    ssl_certificate /etc/letsencrypt/live/preview-syfc.moonlitstarway.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview-syfc.moonlitstarway.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16m;
    client_body_timeout 30s;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        # Preview v1 is HTTP-only. Do not forward WebSocket upgrades.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 30s;
    }
}
